<!DOCTYPE html>
<html>

<head>
    <title>Collaborative Notes</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --shadow: 0 10px 30px rgba(0, 0, 0, .4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .card {
            width: 420px;
            background: var(--card);
            padding: 24px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            position: relative;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            gap: 10px;
        }

        input {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            background: var(--border);
            color: var(--text);
        }

        button.primary {
            background: var(--primary);
            color: white;
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        button.ghost {
            background: transparent;
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .error {
            margin-top: 12px;
            font-size: 13px;
            color: #ef4444;
        }

        /* Room list */
        #room-list {
            margin-top: 20px;
            max-height: 160px;
            overflow-y: auto;
        }

        #room-list h4 {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .room-item {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 6px;
            cursor: pointer;
        }

        .room-item:hover {
            background: rgba(37, 99, 235, 0.1);
        }

        /* Editor */
        #editor {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #textarea {
            flex: 1;
            padding: 24px;
            font-size: 16px;
            border: none;
            outline: none;
            background: var(--bg);
            color: var(--text);
        }

        .status-bar {
            padding: 10px 16px;
            font-size: 13px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="join-form" class="card">
            <h1>Collaborative Notes</h1>
            <p class="subtitle">Create or join a room to start writing</p>
            <div class="form-row">
                <input id="roomId" placeholder="Room ID" />
                <input id="password" type="password" placeholder="Password" />
            </div>
            <div class="actions">
                <button class="primary" onclick="createRoom()">Create Room</button>
                <button onclick="joinRoom()">Join Room</button>
            </div>
            <button id="dark-mode-toggle" class="ghost" onclick="toggleDarkMode()">Dark Mode</button>
            <div id="error" class="error"></div>
            <div id="room-list"></div>
        </div>

        <div id="editor" style="display: none;">
            <textarea id="textarea" spellcheck="false" autocomplete="false" placeholder="Start typing..."></textarea>
            <div class="status-bar">Connected users: <span id="userCount">0</span></div>
        </div>
    </div>

    <script>
        let ws = null;
        let roomId;
        let syncTimeout;
        let isLocalEdit = false;
        const textarea = document.getElementById("textarea");
        const editor = document.getElementById("editor");
        const joinForm = document.getElementById("join-form");
        const errorDiv = document.getElementById("error");
        const userCount = document.getElementById("userCount");
        const roomList = document.getElementById("room-list");
        const darkModeToggle = document.getElementById("dark-mode-toggle");

        function createRoom() {
            const room = document.getElementById("roomId").value.trim();
            const password = document.getElementById("password").value.trim();
            if (!room || !password) {
                showError("Please enter both room ID and password");
                return;
            }
            connect("create", room, password);
        }

        function joinRoom() {
            const room = document.getElementById("roomId").value.trim();
            const password = document.getElementById("password").value.trim();
            if (!room || !password) {
                showError("Please enter both room ID and password");
                return;
            }
            connect("join", room, password);
        }

        function connect(type, room, password) {
            if (!ws || ws.readyState === WebSocket.CLOSED) {
                ws = new WebSocket("wss://room-note.deno.dev");

                ws.onopen = () => {
                    console.log("WebSocket opened");
                    ws.send(JSON.stringify({ type, roomId: room, password }));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    console.log("Received message:", data);
                    switch (data.type) {
                        case "roomList":
                            updateRoomList(data.rooms);
                            break;
                        case "joined":
                            roomId = data.roomId;
                            joinForm.style.display = "none";
                            editor.style.display = "flex";
                            textarea.value = data.content;
                            userCount.textContent = data.userCount;
                            errorDiv.textContent = "";
                            break;
                        case "contentUpdate":
                            if (!isLocalEdit) textarea.value = data.content;
                            break;
                        case "userJoined":
                        case "userLeft":
                            userCount.textContent = data.userCount;
                            break;
                        case "error":
                            showError(data.message);
                            if (type !== "getRooms") {
                                ws.close();
                            }
                            break;
                    }
                };

                ws.onclose = () => {
                    console.log("WebSocket closed");
                    joinForm.style.display = "block";
                    editor.style.display = "none";
                    showError("Disconnected from room");
                    fetchRooms();
                };

                ws.onerror = (e) => {
                    console.error("WebSocket error:", e);
                    showError("Connection error");
                };
            } else if (type !== "getRooms") {
                ws.send(JSON.stringify({ type, roomId: room, password }));
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
        }

        function updateRoomList(rooms) {
            roomList.innerHTML = rooms.length > 0
                ? '<h4>Available Rooms:</h4>' + rooms.map(room =>
                    `<div class="room-item" onclick="document.getElementById('roomId').value='${room}'">${room}</div>`
                ).join('')
                : '<p>No rooms available</p>';
        }

        function fetchRooms() {
            connect("getRooms");
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            darkModeToggle.textContent = isDark ? "Light Mode" : "Dark Mode";
            localStorage.setItem("darkMode", isDark ? "true" : "false");
        }

        textarea.addEventListener("input", () => {
            isLocalEdit = true;
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "update",
                        content: textarea.value,
                    }));
                    isLocalEdit = false;
                }
            }, 50);
        });

        // Load dark mode preference and fetch rooms on page load
        window.onload = () => {
            const darkModePref = localStorage.getItem("darkMode");
            if (darkModePref === "true") {
                document.body.classList.add("dark-mode");
                darkModeToggle.textContent = "Light Mode";
            }
            fetchRooms();
        };
    </script>
</body>

</html>
